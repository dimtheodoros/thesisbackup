# StornX Helm values — eu-west cluster
# OptiBalancer + OptiScaler: both engines active. OptiScaler manages local replica
# counts; the cross-cluster-fallback controller handles spillover to eu-north when
# local resources are exhausted. FederatedHPA is not used in this configuration.
# Prometheus, Istio, metrics-server and Kiali are already installed; only kube-netlag is new.

image:
  repository: "928743223741.dkr.ecr.eu-west-1.amazonaws.com/stornx-fork"
  tag: "failover-v4"

imagePullSecrets: []

config:
  env: production
  namespaces: "online-boutique"
  prometheusUrl: "http://prometheus-operated.online-boutique.svc.cluster.local:9090"
  cronjobExpression: "* * * * *"
  localityLabelsCron: "* * * * *"
  metricsType: "cpu"
  metricsUpperThreshold: "60"
  metricsLowerThreshold: "20"
  responseTimeThreshold: "100"
  cpuWeight: "50"
  memoryWeight: "50"
  balancer:
    minDelta: "5"
    minStepSize: "5"
    maxStepSize: "20"
    urgencyThreshold: "50"
    epsilon: "1"
  faultTolerance:
    ftMaxZones: "3"

extraEnv:
  # Align app data path with the PVC mount below
  - name: DATA_PATH
    value: "/opt/data"
  # Hybrid distribute mode: include eu-north zones in the distribute map so
  # Istio routes a baseline % cross-cluster and can spill more as local CPU
  # climbs. Outlier detection handles real-time ejection within this map.
  - name: REMOTE_ZONES
    value: "eu-north-1/eu-north-1a/*,eu-north-1/eu-north-1b/*,eu-north-1/eu-north-1c/*"
  - name: REMOTE_BASELINE_WEIGHT
    value: "5"
  - name: SPILLOVER_THRESHOLD
    value: "50"
  - name: SPILLOVER_SCALE
    value: "0.5"
  - name: MAX_REMOTE_WEIGHT
    value: "40"

persistence:
  enabled: true
  storageClassName: "gp2"
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /opt/data

# Disable bundled dependencies that are already present in the cluster
prometheus:
  enabled: false

istiod:
  enabled: false

metrics-server:
  enabled: false

kiali:
  enabled: false

# Install kube-netlag DaemonSet (provides node_avg_latency_ms metric)
kube-netlag:
  enabled: true
  imagePullSecrets: []
  nameOverride: "kube-netlag"
  # kube-netlag's built-in ConfigMap-based scrape config is unused here;
  # we scrape it via a PodMonitor applied separately.
  prometheusConfig:
    create: false
  # Reduced CPU request so kube-netlag fits on nodes that are already 90%+
  # allocated by the boutique workloads and Prometheus stack.
  resources:
    requests:
      cpu: 50m
      memory: 40Mi
    limits:
      cpu: 400m
      memory: 80Mi
