# StornX Helm values — eu-north cluster
# OptiBalancer + OptiScaler: both engines active. OptiScaler manages local replica
# counts; the cross-cluster-fallback controller handles spillover to eu-west when
# local resources are exhausted. FederatedHPA is not used in this configuration.
# Identical Prometheus URL to values-west.yaml: same Helm release name on each cluster.

image:
  repository: "928743223741.dkr.ecr.eu-west-1.amazonaws.com/stornx-fork"
  tag: "failover-v4"

imagePullSecrets: []

config:
  env: production
  namespaces: "online-boutique"
  prometheusUrl: "http://prometheus-operated.online-boutique.svc.cluster.local:9090"
  cronjobExpression: "* * * * *"
  localityLabelsCron: "* * * * *"
  metricsType: "cpu"
  metricsUpperThreshold: "60"
  metricsLowerThreshold: "20"
  responseTimeThreshold: "100"
  cpuWeight: "50"
  memoryWeight: "50"
  balancer:
    minDelta: "5"
    minStepSize: "5"
    maxStepSize: "20"
    urgencyThreshold: "50"
    epsilon: "1"
  faultTolerance:
    ftMaxZones: "3"

extraEnv:
  - name: DATA_PATH
    value: "/opt/data"
  # Hybrid distribute mode: include eu-west zones in the distribute map so
  # Istio routes a baseline % cross-cluster and can spill more as local CPU
  # climbs. Outlier detection handles real-time ejection within this map.
  - name: REMOTE_ZONES
    value: "eu-west-1/eu-west-1a/*,eu-west-1/eu-west-1b/*,eu-west-1/eu-west-1c/*"
  - name: REMOTE_BASELINE_WEIGHT
    value: "5"
  - name: SPILLOVER_THRESHOLD
    value: "50"
  - name: SPILLOVER_SCALE
    value: "0.5"
  - name: MAX_REMOTE_WEIGHT
    value: "40"

persistence:
  enabled: true
  storageClassName: "gp2"
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /opt/data

prometheus:
  enabled: false

istiod:
  enabled: false

metrics-server:
  enabled: false

kiali:
  enabled: false

kube-netlag:
  enabled: true
  imagePullSecrets: []
  nameOverride: "kube-netlag"
  prometheusConfig:
    create: false
  resources:
    requests:
      cpu: 50m
      memory: 40Mi
    limits:
      cpu: 400m
      memory: 80Mi
