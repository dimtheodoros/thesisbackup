# StornX Helm values — eu-north cluster
# OptiBalancer + OptiScaler: both engines active. OptiScaler manages local replica
# counts; the cross-cluster-fallback controller handles spillover to eu-west when
# local resources are exhausted. FederatedHPA is not used in this configuration.
# Identical Prometheus URL to values-west.yaml: same Helm release name on each cluster.

image:
  tag: "1.1.1"

imagePullSecrets: []

config:
  env: production
  namespaces: "online-boutique"
  prometheusUrl: "http://prometheus-operated.online-boutique.svc.cluster.local:9090"
  cronjobExpression: "* * * * *"
  localityLabelsCron: "* * * * *"
  metricsType: "cpu"
  metricsUpperThreshold: "80"
  metricsLowerThreshold: "20"
  responseTimeThreshold: "100"
  cpuWeight: "50"
  memoryWeight: "50"
  balancer:
    minDelta: "5"
    minStepSize: "5"
    maxStepSize: "20"
    urgencyThreshold: "50"
    epsilon: "1"
  faultTolerance:
    ftMaxZones: "3"

extraEnv:
  - name: DATA_PATH
    value: "/opt/data"

persistence:
  enabled: true
  storageClassName: "gp2"
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /opt/data

prometheus:
  enabled: false

istiod:
  enabled: false

metrics-server:
  enabled: false

kiali:
  enabled: false

kube-netlag:
  enabled: true
  imagePullSecrets: []
  nameOverride: "kube-netlag"
  prometheusConfig:
    create: false
  resources:
    requests:
      cpu: 50m
      memory: 40Mi
    limits:
      cpu: 400m
      memory: 80Mi
