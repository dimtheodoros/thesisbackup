apiVersion: v1
kind: ServiceAccount
metadata:
  name: stornx-bootstrap
  namespace: stornx
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stornx-bootstrap
  namespace: stornx
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stornx-bootstrap
  namespace: stornx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stornx-bootstrap
subjects:
  - kind: ServiceAccount
    name: stornx-bootstrap
    namespace: stornx
---
# Repopulates /opt/data/deploys/deploys.json every 5 minutes.
# StornX clears the file after each OptiBalancer run; this keeps it populated
# so OptiBalancer fires periodically. 5-minute interval is the minimum safe
# cadence: OptiBalancer takes ~1-2 min to process and patch DRs, after which
# Istio needs ~30s to reconcile EDS. Anything shorter risks a "no healthy
# upstream" race where Envoy sees zero endpoints during EDS reconciliation.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stornx-bootstrap
  namespace: stornx
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 50
      template:
        spec:
          serviceAccountName: stornx-bootstrap
          restartPolicy: Never
          containers:
            - name: writer
              image: bitnami/kubectl:latest
              command:
                - /bin/bash
                - -c
                - |
                  POD=$(kubectl get pods -n stornx -l app.kubernetes.io/name=stornx \
                    -o jsonpath='{.items[0].metadata.name}')
                  [ -z "$POD" ] && exit 0
                  kubectl exec -n stornx "$POD" -- node -e "
                  const fs=require('fs');
                  fs.mkdirSync('/opt/data/deploys',{recursive:true});
                  const services=[
                    'frontend','checkoutservice','cartservice','currencyservice',
                    'productcatalogservice','recommendationservice','emailservice',
                    'paymentservice','shippingservice','adservice'
                  ];
                  const data=services.map(s=>({deployment:s,namespace:'online-boutique'}));
                  fs.writeFileSync('/opt/data/deploys/deploys.json',JSON.stringify(data));
                  console.log('Bootstrap written');
                  "
