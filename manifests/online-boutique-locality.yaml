apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: adservice-locality
  namespace: online-boutique
spec:
  host: adservice.online-boutique.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      localityLbSetting:
        enabled: true
        failover:
        - from: europe-west1
          to: europe-north2
        - from: europe-north2
          to: europe-west1
    outlierDetection:
      consecutive5xxErrors: 1
      interval: 1s
      baseEjectionTime: 1m
      maxEjectionPercent: 100
    tls:
      mode: ISTIO_MUTUAL
---
