apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: online-boutique
  namespace: online-boutique
spec:
  hosts:
  - "*"
  gateways:
  - online-boutique-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        # Typical Online Boutique frontend service is "frontend".
        host: frontend.online-boutique.svc.cluster.local
        port:
          number: 80
