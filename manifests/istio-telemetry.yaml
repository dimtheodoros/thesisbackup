apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-default
  namespace: istio-system
spec:
  metrics:
  - providers:
    - name: prometheus
    overrides:
    - tagOverrides:
        source_cluster:
          expression: upstream_peer.cluster_id
        destination_cluster:
          expression: downstream_peer.cluster_id
        request_protocol:
          expression: request.protocol
  accessLogging:
  - providers:
    - name: envoy
