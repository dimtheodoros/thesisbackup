apiVersion: policy.karmada.io/v1alpha1
kind: OverridePolicy
metadata:
  name: north-zero-replicas
  namespace: online-boutique
spec:
  resourceSelectors:
  - apiVersion: apps/v1
    kind: Deployment
  overrideRules:
  - targetCluster:
      clusterNames:
      - eu-north
    overriders:
      plaintext:
      - path: "/spec/replicas"
        operator: replace
        value: 0
