apiVersion: v1
kind: Pod
metadata:
  name: cpu-stress
  namespace: online-boutique
  labels:
    app: cpu-stress
    experiment: scenario4
spec:
  containers:
  - name: stress
    image: polinux/stress:latest
    args:
    - stress
    - --cpu
    - "2"
    - --timeout
    - "900s"
    resources:
      requests:
        cpu: "2"
        memory: 128Mi
      limits:
        cpu: "2"
        memory: 128Mi
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
