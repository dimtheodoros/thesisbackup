grafana:
  extraContainers: |
    - name: grafana-image-renderer
      image: grafana/grafana-image-renderer:latest
      ports:
        - name: http
          containerPort: 8081
      env:
        - name: HTTP_PORT
          value: "8081"
        - name: ENABLE_METRICS
          value: "true"
        - name: AUTH_TOKEN
          value: "boutique-renderer-token"
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 200m
          memory: 512Mi
  grafana.ini:
    rendering:
      server_url: http://localhost:8081/render
      callback_url: http://localhost:3000/
      renderer_token: boutique-renderer-token
    auth.anonymous:
      enabled: true
      org_role: Viewer
    feature_toggles:
      renderAuthJWT: "false"
